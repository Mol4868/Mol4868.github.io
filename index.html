<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная</title>
</head>
<body>
<table border="1" style="border-spacing: 1px">
  <tbody>
    <tr>
      <td  align="center"style ="width: 720px; height: 1080px">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="index2.html">Кот и таблица</a></li>
            <li><a href="bootstrap.html">бутстрап</a></li>
            <li><a href="flex.html">флекс</a></li>
            <li><a href="flutter.html">флатер</a></li>
          </ul>
      </td>
      <td  align="center"style="width: 1200px; height: 1080px">
        ГЛАВНАЯ
        <div>
          <button type="button" id="google-login">Войти через Google</button>
          <button type="button" id="github-login">Войти через GitHub</button>
          <button type="button" id="auth-logout" hidden>Выйти</button>
          <p id="auth-status" role="status" aria-live="polite"></p>
        </div>
      </td>
    </tr>
  </tbody>
</table>
<script type="module">
      // Supabase Dashboard > Connect: Project URL and publishable (or anon) key.
      // Never put a service_role key, sb_secret key, or OAuth secret here.
      const supabaseConfig = {
        url: "",
        publishableKey: ""
      };
      const redirectTo = "https://mol4868.github.io/";
      const googleButton = document.getElementById("google-login");
      const githubButton = document.getElementById("github-login");
      const logoutButton = document.getElementById("auth-logout");
      const status = document.getElementById("auth-status");
      const loginButtons = [googleButton, githubButton];
      let client;

      function setBusy(busy) {
        for (const button of [...loginButtons, logoutButton]) button.disabled = busy;
      }

      function renderSession(session) {
        const user = session?.user;
        for (const button of loginButtons) button.hidden = Boolean(user);
        logoutButton.hidden = !user;
        status.textContent = user
          ? `Вы вошли как ${user.user_metadata?.full_name || user.user_metadata?.user_name || user.email || "пользователь"}.`
          : "";
      }

      async function login(provider) {
        if (!client) {
          status.textContent = "Авторизация пока не настроена.";
          return;
        }
        setBusy(true);
        status.textContent = "Переходим на страницу входа…";
        try {
          const { error } = await client.auth.signInWithOAuth({
            provider,
            options: {
              redirectTo,
              ...(provider === "google" ? { queryParams: { prompt: "select_account" } } : {})
            }
          });
          if (error) throw error;
        } catch {
          status.textContent = "Не удалось начать вход. Попробуйте ещё раз.";
        } finally {
          setBusy(false);
        }
      }

      googleButton.addEventListener("click", () => login("google"));
      githubButton.addEventListener("click", () => login("github"));
      logoutButton.addEventListener("click", async () => {
        if (!client) return;
        setBusy(true);
        try {
          const { error } = await client.auth.signOut({ scope: "local" });
          if (error) throw error;
          renderSession(null);
          status.textContent = "Вы вышли из аккаунта.";
        } catch {
          status.textContent = "Не удалось выйти. Попробуйте ещё раз.";
        } finally {
          setBusy(false);
        }
      });

      if (supabaseConfig.url.trim() && supabaseConfig.publishableKey.trim()) {
        setBusy(true);
        try {
          const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
          client = createClient(supabaseConfig.url, supabaseConfig.publishableKey, {
            auth: {
              flowType: "pkce",
              detectSessionInUrl: true,
              persistSession: true,
              autoRefreshToken: true
            }
          });
          client.auth.onAuthStateChange((_event, session) => renderSession(session));
          const { data, error } = await client.auth.getSession();
          if (error) throw error;
          renderSession(data.session);
          const hash = new URLSearchParams(window.location.hash.slice(1));
          const query = new URLSearchParams(window.location.search);
          if (hash.has("error") || query.has("error")) {
            status.textContent = "Вход отменён или недоступен. Попробуйте ещё раз.";
            window.history.replaceState(null, "", window.location.pathname);
          }
        } catch {
          client = null;
          status.textContent = "Не удалось загрузить авторизацию. Обновите страницу.";
        } finally {
          setBusy(false);
        }
      }
</script>
</body>
</html>
