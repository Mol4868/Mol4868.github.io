<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная</title>
</head>
<body>
<table border="1" style="border-spacing: 1px">
  <tbody>
    <tr>
      <td  align="center"style ="width: 720px; height: 1080px">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="index2.html">Кот и таблица</a></li>
            <li><a href="bootstrap.html">бутстрап</a></li>
            <li><a href="flex.html">флекс</a></li>
            <li><a href="flutter.html">флатер</a></li>
          </ul>
      </td>
      <td  align="center"style="width: 1200px; height: 1080px">
        ГЛАВНАЯ
        <div>
          <button type="button" id="google-login">Войти через Google</button>
          <button type="button" id="github-login">Войти через GitHub</button>
          <button type="button" id="auth-logout" hidden>Выйти</button>
          <p id="auth-status" role="status" aria-live="polite"></p>
        </div>
      </td>
    </tr>
  </tbody>
</table>
<script type="module">
      // Copy firebaseConfig from Firebase Console > Project settings > Your apps.
      // Enable Google/GitHub in Authentication and authorize mol4868.github.io.
      // The GitHub Client Secret belongs ONLY in Firebase Console, never here.
      const firebaseConfig = {
        apiKey: "",
        authDomain: "",
        projectId: "",
        appId: ""
      };

      const googleButton = document.getElementById("google-login");
      const githubButton = document.getElementById("github-login");
      const logoutButton = document.getElementById("auth-logout");
      const status = document.getElementById("auth-status");
      const loginButtons = [googleButton, githubButton];
      let auth;
      let providers;
      let signInWithPopup;
      let signOut;

      function setBusy(busy) {
        for (const button of [...loginButtons, logoutButton]) button.disabled = busy;
      }

      function showError(error) {
        const messages = {
          "auth/popup-closed-by-user": "Вход отменён.",
          "auth/cancelled-popup-request": "Вход отменён.",
          "auth/popup-blocked": "Разрешите всплывающие окна для входа.",
          "auth/unauthorized-domain": "Вход на этом домене пока недоступен.",
          "auth/operation-not-allowed": "Этот способ входа пока недоступен.",
          "auth/account-exists-with-different-credential": "Этот email уже используется. Войдите тем способом, который выбрали при регистрации.",
          "auth/network-request-failed": "Не удалось подключиться. Проверьте интернет."
        };
        status.textContent = messages[error.code] || "Не удалось выполнить вход. Попробуйте ещё раз.";
      }

      async function login(providerName) {
        if (!auth || !providers) {
          status.textContent = "Авторизация пока не настроена.";
          return;
        }
        setBusy(true);
        status.textContent = "Выполняется вход…";
        try {
          await signInWithPopup(auth, providers[providerName]);
        } catch (error) {
          showError(error);
        } finally {
          setBusy(false);
        }
      }

      googleButton.addEventListener("click", () => login("google"));
      githubButton.addEventListener("click", () => login("github"));
      logoutButton.addEventListener("click", async () => {
        if (!auth) return;
        setBusy(true);
        try {
          await signOut(auth);
          status.textContent = "Вы вышли из аккаунта.";
        } catch {
          status.textContent = "Не удалось выйти. Попробуйте ещё раз.";
        } finally {
          setBusy(false);
        }
      });

      if (["apiKey", "authDomain", "projectId", "appId"].every(key => firebaseConfig[key]?.trim())) {
        try {
          setBusy(true);
          const [{ initializeApp }, authSdk] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js")
          ]);
          auth = authSdk.getAuth(initializeApp(firebaseConfig));
          auth.languageCode = "ru";
          providers = {
            google: new authSdk.GoogleAuthProvider(),
            github: new authSdk.GithubAuthProvider()
          };
          providers.google.setCustomParameters({ prompt: "select_account" });
          signInWithPopup = authSdk.signInWithPopup;
          signOut = authSdk.signOut;
          authSdk.onAuthStateChanged(auth, user => {
            for (const button of loginButtons) button.hidden = Boolean(user);
            logoutButton.hidden = !user;
            status.textContent = user
              ? `Вы вошли как ${user.displayName || user.email || "пользователь"}.`
              : "";
          }, showError);
        } catch {
          auth = null;
          providers = null;
          status.textContent = "Не удалось загрузить авторизацию. Обновите страницу.";
        } finally {
          setBusy(false);
        }
      }
</script>
</body>
</html>
